[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repomark"
version = "0.1.0"
description = "A lightweight zero-dependency repository context packer designed for LLM workflows."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
repomark = "repomark.cli:main"
